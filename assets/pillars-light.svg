<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 352" width="1200" height="352" role="img" aria-label="Exhibit 02 — Core Architectural Pillars">
  <title>Exhibit 02 — Core Architectural Pillars</title>
  <defs>
    <linearGradient id="bg-p-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6F9FC"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="351" rx="12" fill="url(#bg-p-light)" stroke="#CBD5E1"/>
  <text x="45" y="36" fill="#0284C7" font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="600" letter-spacing="1.8">EXHIBIT 02  //  ENGINEERING STANDARDS</text>
  <text x="45" y="62" fill="#051C2C" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.3">Four Non-Negotiable Architectural Pillars</text>
  <line x1="45" y1="78" x2="1155" y2="78" stroke="#CBD5E1" stroke-width="1"/>

  <rect x="45" y="96" width="546" height="108" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="45" y="110" width="3.5" height="80" rx="1.5" fill="#0284C7"/><text x="67" y="128" fill="#0284C7" font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.4">01</text><text x="93" y="128" fill="#051C2C" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Sovereign &amp; Local-First AI</text><text x="67" y="158" fill="#334155" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13.5">Air-gapped execution over open-weights runtimes with full data ownership,</text><text x="67" y="180" fill="#334155" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13.5">deterministic reproducibility, and zero third-party API lock-in.</text><rect x="609" y="96" width="546" height="108" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="609" y="110" width="3.5" height="80" rx="1.5" fill="#2251FF"/><text x="631" y="128" fill="#2251FF" font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.4">02</text><text x="657" y="128" fill="#051C2C" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Neuro-Symbolic &amp; Agentic Harnesses</text><text x="631" y="158" fill="#334155" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13.5">Grounding reasoning in deterministic analytical kernels, structured tools,</text><text x="631" y="180" fill="#334155" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13.5">and protocol-native interfaces (MCP) that constrain search and halt drift.</text><rect x="45" y="220" width="546" height="108" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="45" y="234" width="3.5" height="80" rx="1.5" fill="#6366F1"/><text x="67" y="252" fill="#6366F1" font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.4">03</text><text x="93" y="252" fill="#051C2C" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Recursive Self-Improvement</text><text x="67" y="282" fill="#334155" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13.5">Closed-loop autonomous iteration where every code or strategy mutation</text><text x="67" y="304" fill="#334155" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13.5">passes strict out-of-sample gatekeeping before atomic Git promotion.</text><rect x="609" y="220" width="546" height="108" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="609" y="234" width="3.5" height="80" rx="1.5" fill="#059669"/><text x="631" y="252" fill="#059669" font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.4">04</text><text x="657" y="252" fill="#051C2C" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Zero-Trust &amp; Artifact Governance</text><text x="631" y="282" fill="#334155" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13.5">Hardened execution sandboxes, zero-pickle (CWE-502) serialization,</text><text x="631" y="304" fill="#334155" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13.5">accuracy-vs-latency profiling, and auditable standalone delivery.</text>
</svg>
